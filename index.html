<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>نظام تقييم البرامج التدريبية</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --main: #17375c;
      --blue: #195b97;
      --background: #f3f6fa;
      --border: #dce5ef;
      --text: #1b2938;
      --success: #198754;
      --error: #b3261e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Cairo", Arial, sans-serif;
      background: var(--background);
      color: var(--text);
    }

    header {
      background: var(--main);
      color: white;
      padding: 24px 18px;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      font-weight: 800;
    }

    .subtitle {
      font-size: 15px;
      opacity: 0.95;
    }

    main {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 5px 18px rgba(30, 50, 80, 0.06);
    }

    h2 {
      margin-top: 0;
      color: var(--main);
    }

    h3 {
      margin-top: 30px;
      margin-bottom: 12px;
      color: var(--main);
      font-size: 19px;
    }

    label.field-label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 700;
    }

    select,
    textarea {
      width: 100%;
      font-family: "Cairo", sans-serif;
      font-size: 15px;
      border: 1px solid #bbc8d6;
      border-radius: 10px;
      padding: 12px;
      background: white;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .question {
      padding: 17px 0;
      border-bottom: 1px solid #e6ebf1;
    }

    .question-title {
      line-height: 1.9;
      font-weight: 600;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(130px, 1fr)
      );
      gap: 9px;
      margin-top: 12px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 11px;
      margin: 0;
      border: 1px solid #d9e2ed;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      background: white;
    }

    .option:hover {
      background: #f4f8fc;
    }

    .option input {
      width: auto;
      margin: 0;
    }

    .submit-button {
      width: 100%;
      margin-top: 24px;
      border: 0;
      border-radius: 11px;
      padding: 14px;
      background: var(--blue);
      color: white;
      font-family: "Cairo", sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #confirmation {
      margin-top: 15px;
      font-weight: 700;
      line-height: 1.8;
    }

    .success {
      color: var(--success);
    }

    .error {
      color: var(--error);
    }

    .loading {
      color: var(--main);
    }

    footer {
      text-align: center;
      padding: 26px 15px;
      color: #68798a;
      font-size: 13px;
    }

    @media (max-width: 600px) {

      h1 {
        font-size: 23px;
      }

      .panel {
        padding: 17px;
      }

      .options {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>


<body>

<header>

  <div class="header-inner">

    <h1>
      نظام تقييم البرامج التدريبية
    </h1>

    <div class="subtitle">
      نظام إلكتروني لتقييم البرامج التدريبية وأداء المدرب
    </div>

  </div>

</header>


<main>

  <section class="panel">

    <h2>
      استمارة التقييم
    </h2>


    <label
      class="field-label"
      for="course"
    >
      الدورة التدريبية
    </label>

    <select id="course">

      <option value="">
        جاري تحميل الدورات...
      </option>

    </select>


    <label
      class="field-label"
      for="kind"
    >
      نوع الاستمارة
    </label>

    <select id="kind">

      <option value="lecturer">
        تقييم أداء المحاضر
      </option>

      <option value="program">
        التقييم العام للبرنامج التدريبي
      </option>

    </select>


    <form id="evaluation">

      <div id="questions"></div>

      <button
        id="submitButton"
        class="submit-button"
        type="submit"
      >
        إرسال التقييم
      </button>

    </form>


    <div id="confirmation"></div>

  </section>

</main>


<footer>
  نظام تقييم البرامج التدريبية
</footer>


<script>

/* =========================================================
   بيانات Supabase
   غيّري هذين السطرين فقط
========================================================= */

const SUPABASE_API_URL =
  "https://ztzzjhlxqkmgnhxutwvy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_qK0-N5h9uHDvJSaHArs9eg_7zaSjUzr";


const supabaseHeaders = {
  "apikey": SUPABASE_KEY,
  "Content-Type": "application/json"
};


/* =========================================================
   أسئلة تقييم المحاضر
========================================================= */

const lecturerQuestions = {

  "التخطيط": [

    "درجة التمكن من المادة والثقة بالنفس",

    "مدى الترتيب وتناسق الخطبة",

    "وضوح الهدف وحسن اختيار الموضوع",

    "مناسبة الحديث للجمهور"

  ],


  "الإعداد": [

    "الاستفادة من الإمكانات المتوفرة في المكان",

    "وسائل الإيضاح كثيرة",

    "وسائل الإيضاح معدة جيداً",

    "وسائل الإيضاح متنوعة",

    "تعامل المحاضر مع وسائل الإيضاح جيد"

  ],


  "تسلسل الحديث": [

    "المقدمة قوية وواضحة وتشد الجمهور",

    "وضوح النقاط الرئيسية والفرعية",

    "استعمال الاستشهادات بكثرة",

    "المعلومات جديدة ومفيدة ومقنعة",

    "الخاتمة قوية وواضحة ومؤثرة"

  ],


  "الإلقاء": [

    "المظهر العام لائق",

    "الوقوف والمشي فعال",

    "حركات اليدين مناسبة وفعالة",

    "تعابير الوجه مناسبة وفعالة",

    "نظرات العينين موزعة جيداً",

    "طبقات الصوت وتعبيراته فعالة",

    "الوقفات بين الكلمات والجمل صحيحة",

    "الابتسامة والفكاهة والمرح",

    "اللغة بسيطة ومناسبة والجمل قصيرة",

    "الانتقال فعال بين النقاط الرئيسية والفرعية"

  ],


  "تقييم الأداء والختام": [

    "الالتزام بالوقت ضمن المعقول",

    "انتباه ومشاركة الجمهور مستمرة",

    "إدارة الأسئلة والنقاش بفعالية",

    "استماع المحاضر للجمهور",

    "إدارة المشاكل والمقاطعات والإزعاج"

  ]

};


/* =========================================================
   أسئلة تقييم البرنامج
========================================================= */

const programQuestions = {

  "التنظيم الإداري للبرنامج": [

    "تاريخ عقد البرنامج",

    "مدة تنفيذ البرنامج",

    "عدد ساعات التدريب اليومية",

    "قاعة التدريب (السعة / الإضاءة)",

    "خدمات التغذية",

    "الاستراحات",

    "تجانس المتدربين علمياً",

    "وسائل العرض التدريبية",

    "المادة العلمية"

  ],


  "المحتوى العلمي والأهداف": [

    "توافق أهداف البرنامج مع احتياجاتك"

  ],


  "أساليب التدريب المستخدمة": [

    "أساليب التدريب التي اتبعت",

    "الموازنة بين الجانب النظري والتطبيقي",

    "استخدام وسائل الإيضاح مع التدريب"

  ],


  "المدرب (المحاضر)": [

    "الالتزام بالموعد المحدد للمحاضرة",

    "تمكنه من المادة العلمية",

    "القدرة على الشرح وتوصيل المعلومات"

  ]

};


/* =========================================================
   مقاييس التقييم
========================================================= */

const scales = {

  lecturer: [

    "١ - ضعيف",

    "٢ - مقبول",

    "٣ - جيد",

    "٤ - جيد جداً",

    "٥ - ممتاز"

  ],


  program: [

    "ضعيف",

    "متوسط",

    "جيد",

    "جيد جداً",

    "ممتاز"

  ]

};


/* =========================================================
   متغير الدورات
========================================================= */

let courses = [];


/* =========================================================
   تحميل الدورات من Supabase
========================================================= */

async function loadCourses() {

  const courseSelect =
    document.getElementById("course");


  try {

    const response = await fetch(

      SUPABASE_API_URL +
      "/courses?select=name&active=eq.true&order=id.asc",

      {
        headers: supabaseHeaders
      }

    );


    if (!response.ok) {

      const error =
        await response.text();

      throw new Error(error);

    }


    const data =
      await response.json();


    courses =
      data.map(
        item => item.name
      );


    if (courses.length === 0) {

      courseSelect.innerHTML =
        `
          <option value="">
            لا توجد دورات متاحة حالياً
          </option>
        `;

      return;

    }


    courseSelect.innerHTML =
      courses
        .map(
          (course, index) => `

            <option value="${index}">
              ${course}
            </option>

          `
        )
        .join("");

  }

  catch (error) {

    console.error(
      "خطأ في تحميل الدورات:",
      error
    );


    courseSelect.innerHTML =
      `
        <option value="">
          تعذر تحميل الدورات
        </option>
      `;

  }

}


/* =========================================================
   عرض الأسئلة
========================================================= */

function renderQuestions() {

  const kind =
    document
      .getElementById("kind")
      .value;


  const groups =
    kind === "lecturer"
      ? lecturerQuestions
      : programQuestions;


  const scale =
    scales[kind];


  let html = "";

  let questionNumber = 0;


  for (
    const [heading, questions]
    of Object.entries(groups)
  ) {

    html +=
      `<h3>${heading}</h3>`;


    for (
      const question
      of questions
    ) {

      const id =
        "q" + questionNumber++;


      html += `

        <div class="question">

          <div class="question-title">
            ${question}
          </div>

          <div class="options">

            ${scale
              .map(
                (label, score) => `

                  <label class="option">

                    <input
                      required
                      type="radio"
                      name="${id}"
                      value="${score + 1}"
                    >

                    <span>
                      ${label}
                    </span>

                  </label>

                `
              )
              .join("")}

          </div>

        </div>

      `;

    }

  }


  if (
    kind === "program"
  ) {

    html += `

      <label
        class="field-label"
        for="notes"
      >
        الرجاء الإفادة بأية ملاحظات أخرى
        (اختياري)
      </label>

      <textarea
        id="notes"
        placeholder="اكتب ملاحظاتك هنا..."
      ></textarea>

    `;

  }


  document
    .getElementById("questions")
    .innerHTML = html;


  clearMessage();

}


/* =========================================================
   إرسال التقييم إلى Supabase
========================================================= */

async function submitEvaluation(event) {

  event.preventDefault();


  const form =
    event.currentTarget;


  const submitButton =
    document.getElementById(
      "submitButton"
    );


  const courseSelect =
    document.getElementById(
      "course"
    );


  if (
    courseSelect.value === ""
  ) {

    showMessage(
      "يرجى اختيار دورة تدريبية.",
      "error"
    );

    return;

  }


  const kind =
    document
      .getElementById("kind")
      .value;


  const groups =
    kind === "lecturer"
      ? lecturerQuestions
      : programQuestions;


  const formData =
    new FormData(form);


  const answers = {};

  let index = 0;


  for (
    const questions
    of Object.values(groups)
  ) {

    for (
      const question
      of questions
    ) {

      answers[question] =
        Number(
          formData.get(
            "q" + index
          )
        );


      index++;

    }

  }


  const course =
    courses[
      Number(
        courseSelect.value
      )
    ];


  const notesElement =
    document.getElementById(
      "notes"
    );


  const notes =
    notesElement
      ? notesElement.value.trim()
      : "";


  submitButton.disabled = true;

  submitButton.textContent =
    "جاري الإرسال...";


  showMessage(
    "جاري إرسال التقييم...",
    "loading"
  );


  try {

    const response = await fetch(

      SUPABASE_API_URL +
      "/responses",

      {

        method: "POST",

        headers: {
          ...supabaseHeaders,
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({

          course_name: course,

          form_type: kind,

          answers: answers,

          notes: notes

        })

      }

    );


    if (!response.ok) {

      const error =
        await response.text();

      throw new Error(error);

    }


    form.reset();


    document
      .getElementById("kind")
      .value = kind;


    renderQuestions();


    showMessage(
      "تم إرسال التقييم بنجاح ✅",
      "success"
    );

  }

  catch (error) {

    console.error(
      "خطأ في إرسال التقييم:",
      error
    );


    showMessage(
      "حدث خطأ أثناء إرسال التقييم. يرجى المحاولة مرة أخرى.",
      "error"
    );

  }

  finally {

    submitButton.disabled = false;

    submitButton.textContent =
      "إرسال التقييم";

  }

}


/* =========================================================
   رسائل الحالة
========================================================= */

function showMessage(
  text,
  type
) {

  const box =
    document.getElementById(
      "confirmation"
    );


  box.textContent = text;

  box.className = type;

}


function clearMessage() {

  const box =
    document.getElementById(
      "confirmation"
    );


  box.textContent = "";

  box.className = "";

}


/* =========================================================
   تشغيل الصفحة
========================================================= */

document
  .getElementById("kind")
  .addEventListener(
    "change",
    renderQuestions
  );


document
  .getElementById("evaluation")
  .addEventListener(
    "submit",
    submitEvaluation
  );


renderQuestions();

loadCourses();

</script>

</body>

</html>
