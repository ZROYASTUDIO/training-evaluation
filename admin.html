<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة إدارة التقييمات</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#f3f6fa;
  color:#1d2c3b;
}

header{
  background:#17375c;
  color:white;
  padding:24px 18px;
}

.header-inner{
  max-width:1000px;
  margin:auto;
}

h1{
  margin:0 0 7px;
  font-size:27px;
}

.subtitle{
  opacity:.9;
}

main{
  max-width:1000px;
  margin:28px auto;
  padding:0 15px;
}

.card{
  background:white;
  border:1px solid #dce5ef;
  border-radius:16px;
  padding:23px;
  box-shadow:0 5px 18px rgba(30,50,80,.06);
}

.login-card{
  max-width:500px;
  margin:50px auto;
}

label{
  display:block;
  margin:15px 0 6px;
  font-weight:bold;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #b9c7d5;
  border-radius:9px;
  font-size:15px;
}

button{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  font-size:15px;
  cursor:pointer;
}

.primary{
  width:100%;
  margin-top:20px;
  background:#195b97;
  color:white;
  font-weight:bold;
}

.logout{
  background:#a53c3c;
  color:white;
}

.refresh{
  background:#195b97;
  color:white;
}

#errorMessage{
  color:#b3261e;
  margin-top:14px;
  font-weight:bold;
}

.hidden{
  display:none;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:22px;
}

.summary-box{
  background:#edf4fb;
  border-radius:12px;
  padding:18px;
  text-align:center;
}

.summary-number{
  font-size:26px;
  font-weight:bold;
  color:#17375c;
}

.summary-label{
  margin-top:5px;
  font-size:14px;
}

.response-card{
  border:1px solid #dae3ec;
  border-radius:13px;
  margin:15px 0;
  overflow:hidden;
}

.response-head{
  padding:15px;
  background:#f6f9fc;
}

.response-title{
  font-weight:bold;
  color:#17375c;
  font-size:17px;
}

.meta{
  margin-top:6px;
  font-size:13px;
  color:#657587;
}

.details{
  padding:15px;
}

.answer{
  display:flex;
  justify-content:space-between;
  gap:15px;
  border-bottom:1px solid #eef1f4;
  padding:10px 0;
}

.answer:last-child{
  border-bottom:0;
}

.score{
  font-weight:bold;
  white-space:nowrap;
  color:#195b97;
}

.notes{
  margin-top:15px;
  padding:12px;
  background:#fff9e8;
  border-radius:9px;
  line-height:1.8;
}

.empty{
  text-align:center;
  color:#68798a;
  padding:40px;
}

.loading{
  text-align:center;
  padding:30px;
}

@media(max-width:650px){
  .summary{
    grid-template-columns:1fr;
  }

  .answer{
    flex-direction:column;
    gap:4px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>لوحة إدارة التقييمات</h1>
    <div class="subtitle">
      نظام تقييم البرامج التدريبية وأداء المدرب
    </div>
  </div>
</header>

<main>

<!-- تسجيل الدخول -->
<section id="loginSection" class="card login-card">

  <h2>تسجيل دخول الإدارة</h2>

  <label for="email">البريد الإلكتروني</label>
  <input
    id="email"
    type="email"
    autocomplete="username"
    placeholder="أدخل البريد الإلكتروني"
  >

  <label for="password">كلمة المرور</label>
  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="أدخل كلمة المرور"
  >

  <button
    id="loginButton"
    class="primary"
    type="button"
  >
    تسجيل الدخول
  </button>

  <div id="errorMessage"></div>

</section>


<!-- لوحة الإدارة -->
<section id="adminSection" class="hidden">

  <div class="toolbar">
    <div>
      <strong>لوحة النتائج</strong>
      <div id="userEmail" class="meta"></div>
    </div>

    <div>
      <button
        id="refreshButton"
        class="refresh"
        type="button"
      >
        تحديث النتائج
      </button>
<button
  id="logoutButton"
  class="logout"
  type="button"
>
  تسجيل الخروج
</button>

<button
  id="deleteAllButton"
  class="logout"
  type="button"
>
  حذف جميع التقييمات
</button>
    </div>
  </div>


  <div class="summary">

    <div class="summary-box">
      <div
        id="totalResponses"
        class="summary-number"
      >
        0
      </div>
      <div class="summary-label">
        إجمالي التقييمات
      </div>
    </div>

    <div class="summary-box">
      <div
        id="lecturerCount"
        class="summary-number"
      >
        0
      </div>
      <div class="summary-label">
        تقييم أداء المحاضر
      </div>
    </div>

    <div class="summary-box">
      <div
        id="programCount"
        class="summary-number"
      >
        0
      </div>
      <div class="summary-label">
        تقييم البرنامج
      </div>
    </div>

  </div>

<div class="card">

  <h2>إضافة دورة تدريبية</h2>

  <label>اسم الدورة</label>
  <input
    id="newCourseName"
    type="text"
    placeholder="مثال: دورة إعداد المدربين"
  >

  <label>اسم المحاضر</label>
  <input
    id="newLecturerName"
    type="text"
    placeholder="اكتب اسم المحاضر"
  >

  <button
    id="addCourseButton"
    class="primary"
    type="button"
  >
    إضافة الدورة
  </button>

  <div id="courseMessage"></div>

  <h3>الدورات الحالية</h3>

  <div id="coursesList"></div>

</div>
  <div class="card">
    <h2>التقييمات المستلمة</h2>

    <div id="responsesContainer">
      <div class="loading">
        جاري تحميل النتائج...
      </div>
    </div>
  </div>

</section>

</main>


<script>

/* ========================================
   بيانات Supabase
======================================== */

/*
الصقي نفس API URL المستخدم في index.html
مثال:
https://xxxx.supabase.co/rest/v1
*/

const SUPABASE_REST_URL =
  " https://ztzzjhlxqkmgnhxutwvy.supabase.co/rest/v1/";

/*
الصقي نفس Publishable Key
الذي يبدأ بـ sb_publishable_
*/

const SUPABASE_KEY =
  "sb_publishable_qK0-N5h9uHDvJSaHArs9eg_7zaSjUzr";


const SUPABASE_URL =
  SUPABASE_REST_URL.replace(
    /\/rest\/v1\/?$/,
    ""
  );


/* ========================================
   عناصر الصفحة
======================================== */

const loginSection =
  document.getElementById("loginSection");

const adminSection =
  document.getElementById("adminSection");

const errorMessage =
  document.getElementById("errorMessage");

const responsesContainer =
  document.getElementById("responsesContainer");


/* ========================================
   تسجيل الدخول
======================================== */

async function login(){

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  const button =
    document.getElementById("loginButton");


  if(!email || !password){

    errorMessage.textContent =
      "يرجى إدخال البريد الإلكتروني وكلمة المرور.";

    return;
  }


  button.disabled = true;
  button.textContent = "جاري تسجيل الدخول...";
  errorMessage.textContent = "";


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method:"POST",

          headers:{
            "apikey":SUPABASE_KEY,
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            email:email,
            password:password
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error_description ||
        data.msg ||
        data.message ||
        "بيانات الدخول غير صحيحة."
      );

    }


    sessionStorage.setItem(
      "adminSession",
      JSON.stringify(data)
    );


    openAdmin(
      data.user,
      data.access_token
    );

  }

  catch(error){

    console.error(error);

    errorMessage.textContent =
      "تعذر تسجيل الدخول. تأكدي من البريد وكلمة المرور.";

  }

  finally{

    button.disabled = false;
    button.textContent = "تسجيل الدخول";

  }

}


/* ========================================
   فتح لوحة الإدارة
======================================== */

async function openAdmin(
  user,
  accessToken
){

  loginSection.classList.add("hidden");
  adminSection.classList.remove("hidden");

  document.getElementById(
    "userEmail"
  ).textContent =
    user?.email || "";

  await loadResponses(accessToken);
await loadCoursesForAdmin(accessToken);
}


/* ========================================
   تحميل النتائج
======================================== */

async function loadResponses(
  accessToken
){

  responsesContainer.innerHTML =
    '<div class="loading">جاري تحميل النتائج...</div>';


  try{

    const response =
      await fetch(

        SUPABASE_REST_URL +
        "//responses?select=id,course_name,trainee_name,lecturer_name,form_type,answers,notes,created_at&order=created_at.desc",

        {
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + accessToken
          }
        }

      );


    if(response.status === 401){

      throw new Error(
        "SESSION_EXPIRED"
      );

    }


    if(!response.ok){

      const text =
        await response.text();

      throw new Error(text);

    }


    const responses =
      await response.json();


    renderResponses(responses);

  }

  catch(error){

    console.error(error);

    if(
      error.message ===
      "SESSION_EXPIRED"
    ){

      logout();

      errorMessage.textContent =
        "انتهت جلسة الدخول. سجلي الدخول مرة أخرى.";

      return;
    }


    responsesContainer.innerHTML =
      `
        <div class="empty">
          تعذر تحميل النتائج أو لا توجد صلاحية لعرضها.
        </div>
      `;

  }

}


/* ========================================
   عرض النتائج
======================================== */

function renderResponses(
  responses
){

  document.getElementById(
    "totalResponses"
  ).textContent =
    responses.length;


  const lecturer =
    responses.filter(
      item =>
        item.form_type ===
        "lecturer"
    ).length;


  const program =
    responses.filter(
      item =>
        item.form_type ===
        "program"
    ).length;


  document.getElementById(
    "lecturerCount"
  ).textContent =
    lecturer;


  document.getElementById(
    "programCount"
  ).textContent =
    program;


  if(responses.length === 0){

    responsesContainer.innerHTML =
      `
        <div class="empty">
          لا توجد تقييمات حالياً.
        </div>
      `;

    return;

  }


  responsesContainer.innerHTML =
    responses
      .map(
        item =>
          createResponseHTML(item)
      )
      .join("");

}


/* ========================================
   بطاقة تقييم واحدة
======================================== */

function createResponseHTML(
  item
){

  const type =
    item.form_type === "lecturer"
      ? "تقييم أداء المحاضر"
      : "التقييم العام للبرنامج";


  const date =
    item.created_at
      ? new Date(
          item.created_at
        ).toLocaleString(
          "ar-IQ"
        )
      : "";


  const answers =
    item.answers || {};


  const answerRows =
    Object.entries(answers)
      .map(
        ([question,score]) => `

          <div class="answer">

            <span>
              ${escapeHTML(question)}
            </span>

            <span class="score">
              ${escapeHTML(String(score))} / 5
            </span>

          </div>

        `
      )
      .join("");


  const notes =
    item.notes
      ? `
        <div class="notes">
          <strong>الملاحظات:</strong><br>
          ${escapeHTML(item.notes)}
        </div>
      `
      : "";


  return `

    <div class="response-card">

      <div class="response-head">
<div class="response-title">
  ${escapeHTML(item.course_name || "")}
</div>

<div class="meta">
  المتدرب: ${escapeHTML(item.trainee_name || "غير محدد")}
</div>

<div class="meta">
  المحاضر: ${escapeHTML(item.lecturer_name || "غير محدد")}
</div>

        <div class="meta">
          ${type}
          ${date ? " • " + date : ""}
        </div>

      </div>
<div class="details">

  ${answerRows}

  ${notes}

  <button
    class="logout"
    type="button"
    onclick="deleteResponse(${item.id})"
    style="margin-top:15px;"
  >
    حذف هذا التقييم
  </button>

</div>

    </div>

  `;

}


/* ========================================
   منع إدخال HTML من البيانات
======================================== */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ========================================
   تحديث النتائج
======================================== */

async function refreshResponses(){

  const session =
    getSession();

  if(!session){
    logout();
    return;
  }

  await loadResponses(
    session.access_token
  );

}


/* ========================================
   تسجيل الخروج
======================================== */

function logout(){

  sessionStorage.removeItem(
    "adminSession"
  );

  adminSection.classList.add(
    "hidden"
  );

  loginSection.classList.remove(
    "hidden"
  );

  document.getElementById(
    "password"
  ).value = "";

}


/* ========================================
   قراءة الجلسة
======================================== */

function getSession(){

  try{

    return JSON.parse(
      sessionStorage.getItem(
        "adminSession"
      )
    );

  }

  catch{

    return null;

  }

}

async function loadCoursesForAdmin(accessToken){

  const response = await fetch(
    SUPABASE_REST_URL +
    "/courses?select=id,name,lecturer_name,active&order=id.desc",
    {
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + accessToken
      }
    }
  );

  if(!response.ok){
    return;
  }

  const data = await response.json();

  document.getElementById("coursesList").innerHTML =
data.length ? data.map(course => `
<div class="response-card">
    <div class="details">

      <strong>${escapeHTML(course.name)}</strong><br>

      المحاضر:
      ${escapeHTML(course.lecturer_name || "غير محدد")}

      <br><br>

      <button
        class="logout"
        type="button"
        onclick="deleteCourse(${course.id})"
      >
        حذف الدورة
      </button>

    </div>
  </div>
`).join("")
      : "لا توجد دورات حالياً.";
}


async function addCourse(){

  const session = getSession();

  if(!session){
    logout();
    return;
  }

  const courseName =
    document.getElementById("newCourseName").value.trim();

  const lecturerName =
    document.getElementById("newLecturerName").value.trim();

  const message =
    document.getElementById("courseMessage");

  if(!courseName || !lecturerName){

    message.textContent =
      "يرجى كتابة اسم الدورة واسم المحاضر.";

    return;
  }

  const response = await fetch(
    SUPABASE_REST_URL + "/courses",
    {
      method:"POST",

      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":
          "Bearer " + session.access_token,
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },

      body:JSON.stringify({
        name:courseName,
        lecturer_name:lecturerName,
        active:true
      })
    }
  );

  if(!response.ok){

    message.textContent =
      "تعذر إضافة الدورة، أو أن اسم الدورة موجود مسبقاً.";

    return;
  }

  document.getElementById("newCourseName").value = "";
  document.getElementById("newLecturerName").value = "";

  message.textContent = "تمت إضافة الدورة بنجاح ✅";

  await loadCoursesForAdmin(
    session.access_token
  );
}
  async function deleteCourse(id) {

  if (!confirm("هل تريد حذف هذه الدورة نهائياً؟")) {
    return;
  }

  const session = getSession();

  if (!session) {
    logout();
    return;
  }

  const response = await fetch(
    SUPABASE_REST_URL + "/courses?id=eq." + id,
    {
      method: "DELETE",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization":
          "Bearer " + session.access_token
      }
    }
  );

  if (!response.ok) {
    alert("تعذر حذف الدورة.");
    return;
  }

  await loadCoursesForAdmin(
    session.access_token
  );
}
  async function deleteResponse(id) {

  if (!confirm("هل تريد حذف هذا التقييم نهائياً؟")) {
    return;
  }

  const session = getSession();

  if (!session) {
    logout();
    return;
  }

  const response = await fetch(
    SUPABASE_REST_URL + "/responses?id=eq." + id,
    {
      method: "DELETE",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization":
          "Bearer " + session.access_token
      }
    }
  );

  if (!response.ok) {
    alert("تعذر حذف التقييم.");
    return;
  }

  await loadResponses(
    session.access_token
  );
}
  async function deleteAllResponses() {

  if (
    !confirm(
      "هل تريد حذف جميع التقييمات؟ لا يمكن التراجع عن هذه العملية."
    )
  ) {
    return;
  }

  const session = getSession();

  if (!session) {
    logout();
    return;
  }

  const response = await fetch(
    SUPABASE_REST_URL + "/responses?id=gt.0",
    {
      method: "DELETE",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization":
          "Bearer " + session.access_token
      }
    }
  );

  if (!response.ok) {
    alert("تعذر حذف جميع التقييمات.");
    return;
  }

  await loadResponses(
    session.access_token
  );
}
/* ========================================
   الأحداث
======================================== */

document.getElementById(
  "loginButton"
).addEventListener(
  "click",
  login
);


document.getElementById(
  "password"
).addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){
      login();
    }

  }
);


document.getElementById(
  "logoutButton"
).addEventListener(
  "click",
  logout
);
document.getElementById(
  "deleteAllButton"
).addEventListener(
  "click",
  deleteAllResponses
);

document.getElementById(
  "refreshButton"
).addEventListener(
  "click",
  refreshResponses
);
document.getElementById(
  "addCourseButton"
).addEventListener(
  "click",
  addCourse
);

/* ========================================
   استعادة الجلسة عند تحديث الصفحة
======================================== */

const existingSession =
  getSession();


if(
  existingSession &&
  existingSession.access_token &&
  existingSession.user
){

  openAdmin(
    existingSession.user,
    existingSession.access_token
  );

}

</script>

</body>
</html>
